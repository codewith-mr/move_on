<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#f8f9fa" />
  
      <!-- Candlestick Chart -->
      <rect x="100" y="50" width="600" height="300" fill="#ffffff" rx="4" />
      <rect x="150" y="200" width="40" height="100" fill="#ef4444" rx="4" /> <!-- Red Candle -->
      <rect x="168" y="150" width="4" height="200" fill="#ef4444" rx="4" />
      
      <rect x="250" y="150" width="40" height="120" fill="#22c55e" rx="4" /> <!-- Green Candle -->
      <rect x="268" y="100" width="4" height="220" fill="#22c55e" rx="4" />
      
      <rect x="350" y="180" width="40" height="60" fill="#ef4444" rx="4" /> <!-- Red Candle -->
      <rect x="368" y="160" width="4" height="100" fill="#ef4444" rx="4" />
      
      <rect x="450" y="120" width="40" height="150" fill="#22c55e" rx="4" /> <!-- Green Candle -->
      <rect x="468" y="80" width="4" height="220" fill="#22c55e" rx="4" />
      
      <rect x="550" y="100" width="40" height="80" fill="#22c55e" rx="4" /> <!-- Green Candle -->
      <rect x="568" y="60" width="4" height="160" fill="#22c55e" rx="4" />

      <text x="400" y="400" font-family="Arial, sans-serif" font-size="40" fill="#01513a" text-anchor="middle" font-weight="bold">Trading & Finance</text>
    
</svg>